    <meta name="description" content="Encontre profissionais da sua região no ManiService, plataforma criada por Matheus Lavaqui Ferreira em Toledo, Paraná." />

      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ManiService",
        "url": "https://www.maniservice.com.br/",
        "logo": "https://www.maniservice.com.br/maniservice-monograma.png",

          "@type": "Person",
          "name": "Matheus Lavaqui Ferreira",
          "sameAs": "https://www.linkedin.com/in/matheuslavaqui"

      }
